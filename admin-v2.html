<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">

<title>Criterial. Admin — Prototipo</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{--paper:#f4f0e8;--paper2:#ebe5d9;--ink:#191814;--soft:#706d65;--rule:#c9c1b3;--copper:#c2551b;--navy:#15263b;--green:#406756;--white:#fffdf8;--amber:#a26b1f}
*{box-sizing:border-box}html{scroll-behavior:smooth}
body{margin:0;background:var(--paper);color:var(--ink);font-family:Inter,system-ui,sans-serif;overflow-x:hidden}
a{color:inherit}::selection{background:var(--copper);color:#fff9ee}
/* load screen */
.load-screen{position:fixed;inset:0;background:var(--paper);z-index:60;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px;transition:opacity .5s ease,visibility .5s}
.load-screen.done{opacity:0;visibility:hidden;pointer-events:none}
.load-mark{font:600 30px/1 Fraunces,serif;letter-spacing:-.02em}
.load-mark em{color:var(--copper);font-style:italic}
.load-line{width:120px;height:1px;background:var(--rule);position:relative;overflow:hidden}
.load-line span{position:absolute;left:0;top:0;height:100%;width:40%;background:var(--copper);animation:loadslide 1s ease-in-out infinite}
@keyframes loadslide{0%{left:-40%}100%{left:100%}}
.load-caption{font-size:10px;letter-spacing:.16em;text-transform:uppercase;color:var(--soft)}
/* banner + header */
.proto-banner{padding:9px 20px;background:var(--ink);color:var(--paper);font-size:10px;letter-spacing:.13em;text-transform:uppercase;text-align:center}
.proto-banner b{color:var(--copper);font-weight:600}
.header{height:74px;padding:0 40px;display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid var(--rule);max-width:1440px;margin:auto}
.logo{font:600 25px/1 Fraunces,serif;text-decoration:none}
.logo .adm{font:600 11px/1 Inter,sans-serif;letter-spacing:.18em;text-transform:uppercase;color:var(--copper);margin-left:10px;vertical-align:2px}
.hnav{display:flex;align-items:center;gap:22px;font-size:12px}
.hnav a{text-decoration:none;color:var(--soft)}
.hnav a:hover{color:var(--ink)}
.hnav .access{padding:10px 16px;border:1px solid var(--ink);border-radius:999px;color:var(--ink)}
/* layout */
.shell{max-width:1440px;margin:auto;border-left:1px solid var(--rule);border-right:1px solid var(--rule);min-height:calc(100vh - 120px)}
.admin-layout{display:grid;grid-template-columns:236px 1fr;min-height:inherit}
.side{border-right:1px solid var(--rule);padding:34px 0}
.side-label{padding:0 26px 14px;font-size:10px;letter-spacing:.16em;text-transform:uppercase;color:var(--soft)}
.side a{display:flex;align-items:baseline;gap:12px;padding:11px 26px;text-decoration:none;font-size:13.5px;border-left:2px solid transparent;color:#46443f}
.side a .m{font-size:10px;color:var(--soft);letter-spacing:.08em}
.side a:hover{background:var(--white)}
.side a.active{border-left-color:var(--copper);color:var(--ink);background:var(--white);font-weight:500}
.main{padding:44px 48px 90px}
/* type */
.eyebrow{display:flex;align-items:center;gap:10px;font-size:11px;letter-spacing:.13em;text-transform:uppercase;color:var(--soft)}
.eyebrow:before{content:"";width:8px;height:8px;border-radius:50%;background:var(--copper);box-shadow:0 0 0 5px rgba(194,85,27,.13)}
h1{font:500 clamp(34px,3.6vw,50px)/1 Fraunces,serif;letter-spacing:-.03em;margin:18px 0 10px}
.sub{font-size:14.5px;line-height:1.55;color:#55534c;max-width:640px;margin:0 0 34px}
h2{font:500 22px/1.15 Fraunces,serif;letter-spacing:-.015em;margin:0 0 16px}
.block{margin-top:44px}
/* components */
.grid4{display:grid;grid-template-columns:repeat(4,1fr);gap:14px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.card{background:var(--white);border:1px solid var(--rule);padding:22px 24px}
.kpi-num{font:500 46px/1 Fraunces,serif;letter-spacing:-.02em;margin:6px 0 4px}
.kpi-label{font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:var(--soft)}
.kpi-note{font-size:12px;color:var(--soft)}
.kpi-note b{color:var(--copper);font-weight:600}
.chip{display:inline-flex;align-items:center;gap:7px;padding:5px 12px;border:1px solid var(--rule);border-radius:999px;font-size:10.5px;letter-spacing:.08em;text-transform:uppercase;white-space:nowrap;background:transparent}
.chip i{width:6px;height:6px;border-radius:50%;background:var(--soft);flex:none}
.chip.c-copper{color:var(--copper);border-color:rgba(194,85,27,.4)}.chip.c-copper i{background:var(--copper)}
.chip.c-navy{color:var(--navy);border-color:rgba(21,38,59,.4)}.chip.c-navy i{background:var(--navy)}
.chip.c-green{color:var(--green);border-color:rgba(64,103,86,.45)}.chip.c-green i{background:var(--green)}
.chip.c-gray{color:var(--soft)}.chip.c-gray i{background:#a8a296}
.chip.c-amber{color:var(--amber);border-color:rgba(162,107,31,.45)}.chip.c-amber i{background:var(--amber)}
.btn{display:inline-flex;align-items:center;gap:10px;padding:13px 20px;border-radius:999px;text-decoration:none;font-size:12.5px;border:1px solid transparent;cursor:pointer;background:none;font-family:inherit}
.btn-primary{background:var(--ink);color:var(--paper)}
.btn-secondary{border-color:var(--rule);color:var(--ink);background:transparent}
.btn-copper{background:var(--copper);color:#fff9ee}
.btn-mini{padding:7px 13px;font-size:11px}
.btn:hover{filter:brightness(.94)}
.rows{border-top:1px solid var(--rule)}
.row{display:grid;grid-template-columns:1.6fr 1.2fr .9fr .9fr .7fr 24px;gap:14px;align-items:center;padding:15px 6px;border-bottom:1px solid var(--rule);text-decoration:none;font-size:13px}
.row:hover{background:var(--white)}
.row .t{font-weight:500;font-size:13.5px}
.row .d{color:var(--soft);font-size:12px;margin-top:2px}
.row .arr{color:var(--soft);text-align:right}
/* funnel */
.funnel-row{display:grid;grid-template-columns:170px 1fr 90px;gap:14px;align-items:center;padding:10px 0;border-bottom:1px solid var(--rule);font-size:13px}
.funnel-bar{height:10px;background:var(--paper2);position:relative}
.funnel-bar span{position:absolute;left:0;top:0;bottom:0;background:var(--copper)}
.funnel-bar.navy span{background:var(--navy)}.funnel-bar.green span{background:var(--green)}
.funnel-num{font:500 20px/1 Fraunces,serif;text-align:right}
/* feed + health */
.feed-item{display:flex;gap:14px;padding:11px 0;border-bottom:1px solid var(--rule);font-size:13px;align-items:baseline}
.feed-item .when{flex:none;width:92px;color:var(--soft);font-size:11.5px}
.feed-dot{flex:none;width:7px;height:7px;border-radius:50%;background:var(--copper);align-self:center}
.feed-dot.g{background:var(--green)}.feed-dot.n{background:var(--navy)}.feed-dot.a{background:var(--amber)}
.health-row{display:flex;align-items:center;gap:12px;padding:11px 0;border-bottom:1px solid var(--rule);font-size:13px}
.health-row .tag{margin-left:auto}
/* filters */
.filters{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin-bottom:22px}
.f-input,.f-select{padding:11px 15px;border:1px solid var(--rule);background:var(--white);font:400 13px Inter,sans-serif;color:var(--ink);border-radius:999px;outline:none}
.f-input{width:230px}
.f-input:focus,.f-select:focus{border-color:var(--ink)}
.f-chip{cursor:pointer;transition:all .15s}
.f-chip.on{background:var(--ink);color:var(--paper);border-color:var(--ink)}
.f-chip.on i{background:var(--paper)}
/* detail */
.back{display:inline-flex;align-items:center;gap:8px;font-size:12px;color:var(--soft);text-decoration:none;margin-bottom:22px}
.back:hover{color:var(--ink)}
.detail-head{display:flex;align-items:flex-start;justify-content:space-between;gap:20px;flex-wrap:wrap;margin-bottom:28px}
.detail-head h1{margin-bottom:6px}
.meta-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:0}
.meta-cell{padding:13px 0;border-bottom:1px solid var(--rule);font-size:13px}
.meta-cell .l{font-size:10px;letter-spacing:.13em;text-transform:uppercase;color:var(--soft);margin-bottom:4px}
/* stepper */
.stepper{display:flex;align-items:center;margin:26px 0 8px;flex-wrap:wrap;gap:4px}
.step{display:flex;align-items:center;gap:8px;cursor:pointer;padding:8px 13px;border:1px solid var(--rule);border-radius:999px;font-size:11.5px;background:var(--white)}
.step i{width:7px;height:7px;border-radius:50%;background:transparent;border:1px solid var(--soft)}
.step.done{border-color:var(--copper);color:var(--copper)}
.step.done i{background:var(--copper);border-color:var(--copper)}
.step.current{border-color:var(--ink);font-weight:600}
.step.current i{background:var(--ink);border-color:var(--ink)}
.step-sep{width:14px;height:1px;background:var(--rule)}
/* notes + timeline */
textarea.f-textarea{width:100%;min-height:96px;padding:14px;border:1px solid var(--rule);background:var(--white);font:400 13px/1.5 Inter,sans-serif;color:var(--ink);resize:vertical;outline:none}
textarea.f-textarea:focus{border-color:var(--ink)}
.tl-item{display:flex;gap:14px;padding:10px 0;border-bottom:1px solid var(--rule);font-size:13px}
.tl-item .when{flex:none;width:92px;color:var(--soft);font-size:11.5px}
.tl-kind{flex:none}
/* kanban */
.kanban{display:flex;gap:12px;overflow-x:auto;padding-bottom:16px;margin:0 -48px;padding-left:48px;padding-right:48px}
.kcol{flex:0 0 238px;background:var(--paper2);border:1px solid var(--rule);padding:14px}
.kcol-head{display:flex;align-items:center;justify-content:space-between;font-size:10.5px;letter-spacing:.11em;text-transform:uppercase;color:var(--soft);margin-bottom:12px}
.kcol-head b{font:600 12px Inter;color:var(--ink)}
.kcard{background:var(--white);border:1px solid var(--rule);padding:14px 15px;margin-bottom:10px;text-decoration:none;display:block;cursor:pointer}
.kcard:hover{border-color:var(--ink)}
.kcard .t{font-weight:500;font-size:13px;margin:7px 0 3px}
.kcard .d{font-size:11.5px;color:var(--soft);line-height:1.45}
.kcard .foot{display:flex;justify-content:space-between;align-items:center;margin-top:10px;font-size:11px;color:var(--soft)}
.kcard .foot b{color:var(--copper);font-weight:600}
/* tables */
table.tbl{width:100%;border-collapse:collapse;font-size:13px}
.tbl th{text-align:left;font-size:10px;letter-spacing:.13em;text-transform:uppercase;color:var(--soft);font-weight:500;padding:10px 10px 10px 0;border-bottom:1px solid var(--rule)}
.tbl td{padding:13px 10px 13px 0;border-bottom:1px solid var(--rule);vertical-align:middle}
.tbl tr:hover td{background:var(--white)}
.tbl .t{font-weight:500}
/* generator */
.gen-var{border:1px solid var(--rule);background:var(--white);padding:18px 20px;margin-bottom:12px}
.gen-var .t{font:500 17px/1.3 Fraunces,serif;margin:6px 0 5px}
.gen-var .d{font-size:12.5px;color:#55534c;line-height:1.5}
/* toast */
.toast{position:fixed;left:50%;bottom:26px;transform:translate(-50%,80px);background:var(--ink);color:var(--paper);padding:13px 22px;border-radius:999px;font-size:12.5px;z-index:70;opacity:0;transition:all .35s ease;pointer-events:none;max-width:88vw;text-align:center}
.toast.show{transform:translate(-50%,0);opacity:1}
.toast b{color:var(--copper)}
.empty{padding:34px;border:1px dashed var(--rule);text-align:center;color:var(--soft);font-size:13px}
.observe{opacity:0;transform:translateY(14px);transition:opacity .6s ease,transform .6s ease}
.observe.in-view{opacity:1;transform:none}
@media (max-width:1000px){
  .detail-head{display:block}
  .detail-head>.chip{margin-top:14px}
  .funnel-row{grid-template-columns:118px 1fr 54px;font-size:12px}
  .admin-layout{grid-template-columns:1fr}
  .side{border-right:0;border-bottom:1px solid var(--rule);padding:14px 0;display:flex;overflow-x:auto;align-items:center}
  .side-label{display:none}
  .side a{flex:none;border-left:0;border-bottom:2px solid transparent;padding:10px 16px}
  .side a.active{border-bottom-color:var(--copper)}
  .main{padding:32px 22px 70px}
  .grid4{grid-template-columns:1fr 1fr}
  .grid2{grid-template-columns:1fr}
  .kanban{margin:0 -22px;padding-left:22px;padding-right:22px}
  .header{padding:0 22px}
  .hnav .lbl{display:none}
  .row{grid-template-columns:1.5fr 1fr 24px}
  .row .hide-m{display:none}
  .meta-grid{grid-template-columns:1fr}
}
@media (max-width:640px){.grid4{grid-template-columns:1fr 1fr}.kpi-num{font-size:36px}}
</style>
</head>

const $=s=>document.querySelector(s);
const esc=s=>String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;');
let toastT=null;
function toast(msg){const t=$('#toast');t.innerHTML='Acción simulada — prototipo sin conexión a datos reales.<br><b>'+msg+'</b>';t.classList.add('show');clearTimeout(toastT);toastT=setTimeout(()=>t.classList.remove('show'),2600)}
function chip(txt,color){return '<span class="chip '+color+'"><i></i>'+txt+'</span>'}
function leadChip(st){return chip(LEAD_ESTADOS[st],LEAD_COLOR[st])}
function advChip(e){const map={nuevo:'c-copper',evaluacion:'c-navy',propuesta:'c-amber',aceptado:'c-green',produccion:'c-navy',entregado:'c-green',cerrado:'c-gray'};const lbl=ADV_ETAPAS.find(x=>x[0]===e)[1];return chip(lbl,map[e])}
function sampleChip(e){const m={cola:['En cola','c-navy'],generada:['Generada','c-green'],fallida:['Fallida','c-copper']};return chip(m[e][0],m[e][1])}
function subChip(e){const m={activo:['Activo','c-green'],prueba:['En prueba','c-navy'],impago:['Impago','c-copper']};return chip(m[e][0],m[e][1])}
function pubChip(e){return e==='publicada'?chip('Publicada','c-green'):chip('Borrador','c-gray')}
function pubTipo(t){return{weekly:'Weekly',mensual:'Mensual',muestra:'Muestra',linkedin:'LinkedIn'}[t]}
function leadById(id){return D.leads.find(l=>l.id===id)}
function advById(id){return D.advisory.find(a=>a.id===id)}
function reveal(){document.querySelectorAll('.observe').forEach(el=>{el.classList.add('in-view')})}

}

 const rows=D.subs.map(u=>'<tr><td class="t">'+esc(u.nombre)+'<div style="font-size:11.5px;color:var(--soft);font-weight:400">'+esc(u.empresa)+' · '+esc(u.email)+'</div></td>'
  +'<td>'+u.plan+'<div style="font-size:11.5px;color:var(--soft)">'+u.precio+'</div></td>'
  +'<td>'+subChip(u.estado)+'</td><td>'+u.desde+'</td>'
  +'<td style="white-space:nowrap"><button class="btn btn-secondary btn-mini" onclick="A.stripeSub(\''+u.id+'\')">Ver en Stripe</button> '
  +(u.estado==='activo'?'<button class="btn btn-secondary btn-mini" onclick="A.toggleSub(\''+u.id+'\')">Desactivar</button>':'<button class="btn btn-copper btn-mini" onclick="A.toggleSub(\''+u.id+'\')">Activar</button>')
  +'</td></tr>').join('');
 return '<div class="observe"><div class="eyebrow">M5 · Suscriptores Pro</div><h1>Suscriptores Pro</h1>'
 +'<p class="sub">Gestión de suscripciones mientras Stripe sigue en modo prueba: alta y baja manual, estado de pago y registro de distribución.</p>'
 +'<div class="card" style="padding:8px 22px"><div style="padding:14px 0 4px">'+chip('Stripe en modo prueba','c-amber')+'</div><table class="tbl"><tr><th>Suscriptor</th><th>Plan</th><th>Estado</th><th>Desde</th><th>Acciones</th></tr>'+rows+'</table></div>'
 +'<div class="block card"><h2>Registro de distribución</h2>'
 +'<div class="feed-item"><span class="feed-dot g"></span><span class="when">20 ago</span><span>Weekly Signals — 20 de agosto → 5 suscriptores Pro</span></div>'
 +'<div class="feed-item"><span class="feed-dot g"></span><span class="when">1 sep</span><span>Brief Mensual — agosto 2026 → 5 suscriptores Pro</span></div>'
 +'<div class="feed-item"><span class="feed-dot g"></span><span class="when">13 ago</span><span>Weekly Signals — 13 de agosto → 4 suscriptores Pro</span></div>'
 +'</div></div>';
}

let VARIATIONS=null;
function vContenido(){
 const rows=D.pubs.map(p=>'<tr><td class="t">'+esc(p.titulo)+'</td><td>'+chip(pubTipo(p.tipo),'c-gray')+'</td><td>'+pubChip(p.estado)+'</td><td>'+p.fecha+'</td><td style="font-size:11.5px;color:var(--soft)">'+(p.enviada||'—')+'</td>'
  +'<td style="white-space:nowrap"><button class="btn btn-secondary btn-mini" onclick="A.pubAct(\''+p.id+'\',\'previsualizar\')">Previsualizar</button> '
  +(p.estado==='borrador'?'<button class="btn btn-copper btn-mini" onclick="A.pubAct(\''+p.id+'\',\'publicar\')">Publicar</button>':'<button class="btn btn-secondary btn-mini" onclick="A.pubAct(\''+p.id+'\',\'despublicar\')">Despublicar</button>')+' '
  +(p.estado==='publicada'?'<button class="btn btn-secondary btn-mini" onclick="A.pubAct(\''+p.id+'\',\'enviar\')">Enviar →</button> ':'')
  +'<button class="btn btn-secondary btn-mini" onclick="A.pubAct(\''+p.id+'\',\'linkedin\')">LinkedIn</button></td></tr>').join('');
 let vars='<div class="empty" id="varbox">Genera variaciones para comparar enfoques antes de guardar un borrador.</div>';
 if(VARIATIONS){
  vars=VARIATIONS.map((v,i)=>'<div class="gen-var"><span class="chip c-copper"><i></i>Variación '+(i+1)+'</span><div class="t">'+esc(v.t)+'</div><div class="d">'+esc(v.d)+'</div><div style="margin-top:12px"><button class="btn btn-secondary btn-mini" onclick="A.saveDraft('+i+')">Guardar como borrador</button></div></div>').join('');
 }
 return '<div class="observe"><div class="eyebrow">M1 · Contenido y publicaciones</div><h1>Contenido</h1>'
 +'<p class="sub">El módulo que ya funciona hoy: generar Weekly y Brief Mensual, revisar variaciones, publicar y distribuir. Aquí se mantiene, con la misma lógica y mejor presentación.</p>'
 +'<div class="card"><h2>Nuevo contenido</h2>'
 +'<div class="filters" style="margin-bottom:14px"><select class="f-select" id="gentype"><option value="weekly">Weekly Signals</option><option value="mensual">Brief Mensual</option></select>'
 +'<input class="f-input" style="width:280px" placeholder="Tema o foco opcional (p. ej. industria auxiliar)">'
 +'<button class="btn btn-primary btn-mini" onclick="A.genVars()">Generar variaciones</button></div>'
 +'<div id="variations">'+vars+'</div></div>'
 +'<div class="block card" style="padding:8px 22px"><table class="tbl"><tr><th>Publicación</th><th>Tipo</th><th>Estado</th><th>Fecha</th><th>Enviada</th><th>Acciones</th></tr>'+rows+'</table></div></div>';
}

/* ============ Router ============ */
function route(){
 const h=(location.hash||'#/resumen').replace(/^#\//,'');
 const [view,param]=h.split('/');
 const app=$('#app');
 document.querySelectorAll('.side a').forEach(a=>a.classList.toggle('active',a.dataset.r===view));
 if(view==='leads'&&param)app.innerHTML=vLeadDetail(param);
 else if(view==='leads')app.innerHTML=vLeads();
 else if(view==='advisory'&&param)app.innerHTML=vAdvDetail(param);
 else if(view==='advisory')app.innerHTML=vAdvisory();
 else if(view==='muestras')app.innerHTML=vMuestras();
 else if(view==='suscriptores')app.innerHTML=vSuscriptores();
 else if(view==='contenido')app.innerHTML=vContenido();
 else app.innerHTML=vResumen();
 reveal();window.scrollTo(0,0);
}
addEventListener('hashchange',route);

/* ============ Acciones simuladas ============ */
window.A={
 fLeadQ(v){LF.q=v;const app=$('#app');app.innerHTML=vLeads();reveal();const inp=app.querySelector('.f-input');inp.focus();inp.setSelectionRange(inp.value.length,inp.value.length)},
 fLeadSt(v){LF.st=v;$('#app').innerHTML=vLeads();reveal()},
 fLeadSrc(v){LF.src=v;$('#app').innerHTML=vLeads();reveal()},
 leadStatus(id,st){const l=leadById(id);l.estado=st;l.eventos.unshift({tipo:'Nota',texto:'Estado cambiado a '+LEAD_ESTADOS[st],fecha:'hoy'});$('#app').innerHTML=vLeadDetail(id);reveal();toast('Lead '+id+' movido a '+LEAD_ESTADOS[st])},
 saveNote(id){const l=leadById(id);l.notas=$('#note-'+id).value;toast('Nota guardada en '+id)},
 addEvent(id,tipo){const l=leadById(id);l.eventos.unshift({tipo,texto:'Nuevo evento de tipo '+tipo.toLowerCase()+' (borrador)',fecha:'hoy'});$('#app').innerHTML=vLeadDetail(id);reveal();toast('Evento de seguimiento añadido a '+id)},
 advStage(id,st){const a=advById(id);a.etapa=st;$('#app').innerHTML=vAdvDetail(id);reveal();toast('Encargo '+id+' movido a '+ADV_ETAPAS.find(x=>x[0]===st)[1])},
 genDeliv(id){const a=advById(id);a.entregable={estado:'draft',nombre:'Borrador v1 · '+a.tipo.toLowerCase()+' · '+a.empresa};$('#app').innerHTML=vAdvDetail(id);reveal();toast('Borrador de entregable generado para '+id)},
 uploadDeliv(id){const a=advById(id);a.entregable={estado:'final',nombre:a.tipo+' · '+a.empresa+' · vFinal.pdf'};$('#app').innerHTML=vAdvDetail(id);reveal();toast('Entregable final registrado para '+id)},
 prevDeliv(id){toast('Previsualización del entregable de '+id)},
 downloadDeliv(id){toast('Descarga del PDF de '+id)},
 emailClient(id){const a=advById(id);a.etapa='entregado';$('#app').innerHTML=vAdvDetail(id);reveal();toast('Entregable enviado al cliente de '+id)},
 closeAdv(id){const a=advById(id);a.etapa='cerrado';$('#app').innerHTML=vAdvDetail(id);reveal();toast('Encargo '+id+' cerrado')},
 prevSample(id){toast('Brief de muestra '+id+' abierto en el visor')},
 retrySample(id){const s=D.samples.find(x=>x.id===id);s.estado='cola';$('#app').innerHTML=vMuestras();reveal();toast('Muestra '+id+' recolocada en la cola de generación')},
 resendSample(id){toast('Email de muestra '+id+' reenviado al lead')},
 stripeSub(id){toast('Ficha de Stripe de '+id+' (cuenta en modo prueba)')},
 toggleSub(id){const u=D.subs.find(x=>x.id===id);u.estado=u.estado==='activo'?'impago':'activo';$('#app').innerHTML=vSuscriptores();reveal();toast('Suscripción de '+id+' '+(u.estado==='activo'?'activada':'desactivada')+' manualmente')},
 genVars(){const t=$('#gentype').value;VARIATIONS=[
  {t:t==='weekly'?'Weekly Signals — 17 de septiembre de 2026':'Brief Mensual — septiembre 2026',d:'Enfoque A: tres señales con más tracción de la semana, con lectura corta y mapa de actores por señal.'},
  {t:t==='weekly'?'Las señales que importan esta semana':'Septiembre en contexto: el mes en señales',d:'Enfoque B: una señal principal a fondo y dos secundarias, con comparables y valoraciones de referencia.'},
  {t:t==='weekly'?'Edición semanal: rotación hacia servicios industriales':'Panorama mensual: rotación hacia servicios industriales',d:'Enfoque C: edición temática monográfica con un solo sector protagonista y tres operaciones comentadas.'}];
  $('#app').innerHTML=vContenido();reveal();toast('Tres variaciones generadas para revisión')},
 saveDraft(i){D.pubs.unshift({id:'P'+(D.pubs.length+1),titulo:VARIATIONS[i].t,tipo:$('#gentype')?$('#gentype').value:'weekly',estado:'borrador',fecha:'hoy',enviada:null});VARIATIONS=null;$('#app').innerHTML=vContenido();reveal();toast('Borrador guardado en la lista de publicaciones')},
 pubAct(id,act){const p=D.pubs.find(x=>x.id===id);
  if(act==='publicar'){p.estado='publicada';p.enviada='pendiente de envío'}
  if(act==='despublicar'){p.estado='borrador';p.enviada=null}
  $('#app').innerHTML=vContenido();reveal();
  const msg={previsualizar:'Previsualización de la publicación',publicar:'Publicación publicada (notificación automática a Pro)',despublicar:'Publicación retirada a borrador',enviar:'Envío por email a suscriptores Pro',linkedin:'Borrador de post de LinkedIn generado'}[act];
  toast(msg)}
};

/* loader + arranque */
addEventListener('load',()=>setTimeout(()=>document.querySelector('.load-screen').classList.add('done'),650));
setTimeout(()=>document.querySelector('.load-screen').classList.add('done'),3200);
route();
</script>
