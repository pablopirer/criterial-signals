<head>

</head>
<body>
<header class="hdr"><div class="wrap">
  <a class="brand" href="index.html">Criterial<i>.</i></a>
  <nav class="nav" aria-label="Principal"><a href="signals.html" aria-current="page">Signals</a><a href="encargos.html">Advisory</a><a href="pricing.html">Planes</a><a href="about.html">Nosotros</a><a class="nav-m" href="archive.html">Acceso Pro</a></nav>
  <div class="hdr-cta"><a class="btn btn--ghost" href="archive.html">Acceso Pro</a><a class="btn" href="pricing.html">Suscribirse</a></div>
  <button class="menu-btn" type="button" aria-expanded="false" aria-label="Menú">☰</button>
</div><div class="progress"></div></header>
<main>
<div class="ribbon"><div class="wrap"><span><b>Muestra personalizada</b> · preparada a partir de tu solicitud</span><a href="pricing.html">Ver planes →</a></div></div>
<div id="mu-root"><div class="wrap"><p class="state" id="mu-loading">Cargando tu muestra…</p></div></div>
</main>
<footer class="ftr"><div class="wrap"><span>Criterial<i>.</i> — Inteligencia de capital privado · España</span>
<nav aria-label="Pie"><a href="signals.html">Signals</a><a href="encargos.html">Advisory</a><a href="pricing.html">Planes</a><a href="archive.html">Acceso Pro</a><a href="mailto:hola@criterialsignals.com">Contacto</a></nav></div></footer>
<script>
  // Muestra interactiva: lee body_data por token (get-sample, público) y la
  // pinta con el mismo lector que el Brief. El mapa usa el renderer compartido
  // (window.renderPubMap en criterial-shared.js).
  const GET_SAMPLE_URL = "https://epmltqhtxkmfboaxdois.supabase.co/functions/v1/get-sample";
  const MONTHS_ES = ["enero","febrero","marzo","abril","mayo","junio","julio","agosto","septiembre","octubre","noviembre","diciembre"];
  const MOM = { creciente: ["Creciente", "pos"], estable: ["Estable", "flat"], enfriandose: ["Enfriándose", "neg"] };

  function el(tag, cls, text) {
    const n = document.createElement(tag);
    if (cls) n.className = cls;
    if (text != null) n.textContent = text;
    return n;
  }
  function section(id, n, title) {
    const s = el("section", "sec"); s.id = id;
    const hd = el("div", "sec-hd");
    hd.appendChild(el("span", "n", String(n).padStart(2, "0")));
    hd.appendChild(el("h2", null, title));
    s.appendChild(hd);
    return s;
  }
  function periodLabel(s) {
    const d = s.created_at ? new Date(s.created_at) : null;
    return d && !isNaN(d) ? `${MONTHS_ES[d.getMonth()]} de ${d.getFullYear()}` : "";
  }
  function showState(msg) {
    const root = document.getElementById("mu-root");
    root.innerHTML = "";
    const w = el("div", "wrap");
    w.appendChild(el("p", "state", msg));
    root.appendChild(w);
  }

  function render(s) {
    const d = s.body_data;
    if (!d) { showState("Esta muestra no está disponible en el nuevo formato."); return; }
    const root = document.getElementById("mu-root");
    root.innerHTML = "";

    // Cabecera del informe
    const top = el("div", "rpt-top"), tw = el("div", "wrap");
    tw.appendChild(el("div", "spacer"));
    const title = el("div", "rpt-title");
    const ey = el("span", "eyebrow");
    const bits = ["Signals · Muestra", d.sector, periodLabel(s)].filter(Boolean);
    bits.forEach((b, i) => {
      if (i) ey.appendChild(el("span", "sep", "/"));
      ey.appendChild(i ? document.createTextNode(b) : el("b", null, b));
    });
    title.appendChild(ey);
    title.appendChild(el("h1", null, d.titulo || s.title || "Tu muestra"));
    if (d.tesis) title.appendChild(el("p", "dek", d.tesis));
    const meta = el("div", "meta");
    (Array.isArray(d.tags) ? d.tags : []).forEach((t) => meta.appendChild(el("span", "tag", t)));
    meta.appendChild(el("span", "grow"));
    const copy = el("button", null, "Copiar enlace"); copy.type = "button";
    copy.addEventListener("click", () => {
      const done = () => { copy.textContent = "Enlace copiado"; setTimeout(() => { copy.textContent = "Copiar enlace"; }, 1600); };
      if (navigator.clipboard) navigator.clipboard.writeText(location.href).then(done, done); else done();
    });
    const pr = el("button", null, "Imprimir"); pr.type = "button";
    pr.addEventListener("click", () => window.print());
    meta.appendChild(copy); meta.appendChild(pr);
    title.appendChild(meta);
    tw.appendChild(title); top.appendChild(tw); root.appendChild(top);

    const wrap = el("div", "wrap"), rpt = el("div", "rpt rpt--flush");
    const toc = el("aside", "toc"), art = el("article");
    rpt.appendChild(toc); rpt.appendChild(art); wrap.appendChild(rpt); root.appendChild(wrap);
    let n = 0;

    // Cifras
    if (Array.isArray(d.stats) && d.stats.length) {
      const k = el("div", "kpis num");
      d.stats.slice(0, 4).forEach((st) => {
        const c = el("div");
        c.appendChild(el("b", null, st.valor || ""));
        c.appendChild(el("span", null, st.label || ""));
        k.appendChild(c);
      });
      art.appendChild(k);
    }
    // Resumen ejecutivo
    if (d.snapshot) {
      const sec = section("resumen", ++n, "Resumen ejecutivo");
      const p = el("div", "prose lead"); p.appendChild(el("p", null, d.snapshot));
      sec.appendChild(p); art.appendChild(sec);
    }
    // Señales
    if (Array.isArray(d.signals) && d.signals.length) {
      const sec = section("senales", ++n, "Señales del periodo");
      d.signals.forEach((sig, i) => {
        const a = el("article", "signal signal--s"), side = el("aside");
        side.appendChild(el("small", null, String(i + 1).padStart(2, "0")));
        const m = MOM[sig.momentum];
        if (m) side.appendChild(el("span", "mom mom--" + m[1], m[0]));
        const body = el("div");
        body.appendChild(el("h3", null, sig.titulo || ""));
        body.appendChild(el("p", "fact", sig.cuerpo || ""));
        a.appendChild(side); a.appendChild(body); sec.appendChild(a);
      });
      art.appendChild(sec);
    }
    // Mapa (si el renderer lo acepta; un mapa inválido no rompe la muestra)
    if (d.mapa && window.renderPubMap) {
      const sec = section("mapa", n + 1, "Mapa de posicionamiento");
      const host = el("div", "pub-map");
      sec.appendChild(host); art.appendChild(sec);
      if (window.renderPubMap(host, d.mapa)) n++; else sec.remove();
    }
    // Qué vigilar
    if (Array.isArray(d.watch) && d.watch.length) {
      const sec = section("vigilar", ++n, "Qué vigilar");
      const g = el("div", "grid2");
      d.watch.forEach((w) => {
        const c = el("div");
        c.appendChild(el("h3", null, w.titulo || ""));
        c.appendChild(el("p", null, w.cuerpo || ""));
        g.appendChild(c);
      });
      sec.appendChild(g); art.appendChild(sec);
    }
    // Fuentes (solo enlaces http/https)
    const fuentes = Array.isArray(d.fuentes) ? d.fuentes.filter((f) => f && (f.titulo || f.medio)) : [];
    if (fuentes.length) {
      const sec = section("fuentes", ++n, "Fuentes");
      const ol = el("ol", "refs");
      fuentes.slice(0, 8).forEach((f) => {
        const li = el("li"), span = el("span");
        const titulo = f.titulo || f.medio || "";
        const metaTxt = [f.medio, f.fecha].filter(Boolean).join(", ");
        const url = (typeof f.url === "string" && /^https?:\/\//.test(f.url)) ? f.url : null;
        if (url) {
          const a = el("a", null, titulo);
          a.href = url; a.target = "_blank"; a.rel = "noopener noreferrer";
          span.appendChild(a);
        } else span.appendChild(el("b", null, titulo));
        if (metaTxt) span.appendChild(document.createTextNode(" — " + metaTxt));
        li.appendChild(span); ol.appendChild(li);
      });
      sec.appendChild(ol); art.appendChild(sec);
    }
    // Siguiente paso
    const next = el("div", "next");
    next.innerHTML =
      '<div><span class="eyebrow">Siguiente paso</span><h3>Recibe Signals cada semana</h3>' +
      '<p>La edición abierta llega gratis a tu correo con cada publicación.</p>' +
      '<a class="btn" href="signals.html#suscribir">Recibir Signals</a></div>' +
      '<div class="next-pro"><span class="eyebrow">Pro · 9,90 €/mes</span><h3>El análisis completo</h3>' +
      '<p>Signals semanales con patrón e implicación, el Brief Mensual y el archivo completo.</p>' +
      '<a class="btn btn--ghost" href="pricing.html">Ver Pro</a></div>';
    art.appendChild(next);

    // Índice
    const secs = [].slice.call(art.querySelectorAll("section.sec"));
    if (secs.length > 1) {
      toc.appendChild(el("span", "eyebrow", "Contenido"));
      const ol = el("ol");
      const links = secs.map((sec) => {
        const li = el("li"), a = el("a", null, sec.querySelector("h2").textContent);
        a.href = "#" + sec.id; li.appendChild(a); ol.appendChild(li);
        return a;
      });
      toc.appendChild(ol);
      if ("IntersectionObserver" in window) {
        const io = new IntersectionObserver((es) => es.forEach((e) => {
          if (e.isIntersecting) links.forEach((a) => a.classList.toggle("on", a.getAttribute("href") === "#" + e.target.id));
        }), { rootMargin: "-12% 0px -75% 0px" });
        secs.forEach((sec) => io.observe(sec));
      }
    }
    if (d.titulo) document.title = d.titulo + " | Criterial.";
    window.dispatchEvent(new Event("resize"));
  }

  (async function () {
    const token = new URLSearchParams(location.search).get("token");
    if (!token) { showState("Falta el identificador de la muestra. Revisa el enlace de tu email."); return; }
    try {
      const res = await fetch(`${GET_SAMPLE_URL}?token=${encodeURIComponent(token)}`);
      if (res.status === 404) { showState("No encontramos esta muestra. Es posible que el enlace haya caducado."); return; }
      if (!res.ok) throw new Error("HTTP " + res.status);
      const data = await res.json();
      render(data.sample);
    } catch (err) {
      showState("No se pudo cargar la muestra. Inténtalo de nuevo en unos minutos.");
    }
  })();
</script>
<script src="criterial-shared.js?v=13"></script>
</body>
</html>
