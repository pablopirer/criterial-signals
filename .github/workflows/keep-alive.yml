name: Keep Supabase alive

on:
  schedule:
    - cron: '0 9 */3 * *'  # cada 3 días a las 9:00 UTC (con */5 el salto de fin de mes llegaba a 6 días)
  workflow_dispatch:        # permite ejecutarlo manualmente

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Supabase
        env:
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          STATUS=$(curl -s -o /dev/null -w "%{http_code}" \
            -H "apikey: $SUPABASE_ANON_KEY" \
            -H "Authorization: Bearer $SUPABASE_ANON_KEY" \
            "https://epmltqhtxkmfboaxdois.supabase.co/rest/v1/publications?select=id&limit=1")
          echo "HTTP $STATUS — ping enviado"
          # Fallar si no es 200: un 401 (clave caducada) o un proyecto ya
          # pausado no registran actividad, y antes pasaban en verde.
          # Un job fallido hace que GitHub avise por email.
          if [ "$STATUS" != "200" ]; then
            echo "::error::Supabase respondió HTTP $STATUS; el keep-alive no está registrando actividad"
            exit 1
          fi
