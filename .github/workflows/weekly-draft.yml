name: Weekly en borrador

# Cada lunes a primera hora genera el Weekly de la semana que acaba de cerrar
# (lunes a domingo) y lo guarda como BORRADOR. Nunca
# publica: se revisa y se publica a mano desde admin.html, que es lo que avisa a
# los suscriptores y alimenta la base de operaciones.
# Si la generación falla (el modelo no devuelve JSON válido, la API da error),
# el job falla, no se guarda nada y GitHub avisa por email. El resumen del job
# dice cuántas operaciones trae el borrador.

on:
  schedule:
    - cron: '0 5 * * 1'   # lunes 5:00 UTC: 6:00 en Madrid en invierno, 7:00 en verano
  workflow_dispatch:       # permite lanzarlo a mano

concurrency:
  group: weekly-draft
  cancel-in-progress: false

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5

      - name: Generar el Weekly y guardarlo como borrador
        env:
          AUTO_DRAFT: '1'
          TZ: Europe/Madrid
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          SUPABASE_URL: https://epmltqhtxkmfboaxdois.supabase.co/rest/v1/
        run: bash scripts/generate-content.sh weekly
